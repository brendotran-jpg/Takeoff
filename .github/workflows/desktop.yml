name: Desktop build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
      - name: Test
        run: pytest -q
      - name: Build (includes bundle self-test)
        run: python scripts/build_desktop.py
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Takeoff -DestinationPath Takeoff-windows.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Takeoff.app Takeoff-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Takeoff-${{ runner.os }}
          path: Takeoff-*.zip
